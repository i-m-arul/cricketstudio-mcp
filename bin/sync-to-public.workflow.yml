# sync-to-public.workflow.yml
#
# ══════════════════════════════════════════════════════════════════════════════
# THIS FILE BELONGS IN THE PRIVATE MONOREPO, NOT IN cricketstudio-mcp.
# Copy it to:  .github/workflows/sync-to-public.yml  in the private repo.
# ══════════════════════════════════════════════════════════════════════════════
#
# Security model (moat boundary):
#
#   The private monorepo holds the algorithm (ball-by-ball aggregation code).
#   The public repo (cricketstudio-mcp) holds ONLY the sanitized output.
#   These must NEVER be in the same git push or CI job.
#
#   This workflow generates the snapshot, validates it against the content
#   gate, then uploads it as a GitHub Actions artifact — it does NOT commit
#   to the public repo directly. A human downloads the artifact, runs
#   `node scripts/verify-snapshot.mjs --incoming <dir>` locally, reviews
#   the diff, then runs with --apply to copy + bump + commit.
#
#   Why local-first instead of automated push?
#   - Protects against accidental source-code leaks in build-mcp-snapshot.mjs
#   - Gives a human a chance to review count changes before they go public
#   - Separates "build" (automated) from "publish" (intentional human action)
#
# Required secrets (in the PRIVATE repo's settings):
#   None needed for artifact-only mode. The human handles the push.
#
# Optional: if you trust the pipeline fully and want fully automated push,
#   see the AUTOMATED PUSH section at the bottom (disabled by default).
#
# Trigger:
#   - Manual: workflow_dispatch (Run workflow button in GitHub Actions UI)
#   - Scheduled: uncomment the cron line (e.g. every Monday 06:00 UTC)

name: Build MCP snapshot (artifact)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (minor = new season data, patch = corrections only)'
        required: false
        default: 'minor'
        type: choice
        options: [minor, patch]
  # schedule:
  #   - cron: '0 6 * * 1'   # Every Monday 06:00 UTC

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read   # read private repo only

    steps:
      # ── 1. Checkout private monorepo ───────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Node setup ──────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ── 3. Build sanitized snapshot ────────────────────────────────────────
      #    Output must land in: mcp-snapshot-out/*.json  (all 20 files)
      - name: Build sanitized MCP snapshot
        run: node scripts/build-mcp-snapshot.mjs --out mcp-snapshot-out

      # ── 4. Content gate — validate BEFORE artifact upload ─────────────────
      #    Uses the public repo's validate-snapshot.mjs via npx.
      #    Blocks the artifact if any banned string / unknown file is present.
      - name: Install cricketstudio-mcp (content gate script only)
        run: npm install --no-save cricketstudio-mcp

      - name: Run content gate on output
        run: node node_modules/cricketstudio-mcp/scripts/validate-snapshot.mjs --dir mcp-snapshot-out

      # ── 5. Upload artifact ─────────────────────────────────────────────────
      #    Retained for 7 days. Download via GitHub UI or `gh run download`.
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-snapshot-${{ github.run_number }}
          path: mcp-snapshot-out/
          retention-days: 7

      - name: Summary
        run: |
          echo "## Snapshot artifact ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Content gate: ✓ passed" >> $GITHUB_STEP_SUMMARY
          echo "Bump type: ${{ github.event.inputs.bump || 'minor' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### To apply locally:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "gh run download ${{ github.run_id }} -n mcp-snapshot-${{ github.run_number }} -D /tmp/mcp-snapshot" >> $GITHUB_STEP_SUMMARY
          echo "cd /path/to/cricketstudio-mcp" >> $GITHUB_STEP_SUMMARY
          echo "node scripts/verify-snapshot.mjs --incoming /tmp/mcp-snapshot" >> $GITHUB_STEP_SUMMARY
          echo "# review the diff above, then:" >> $GITHUB_STEP_SUMMARY
          echo "node scripts/verify-snapshot.mjs --incoming /tmp/mcp-snapshot --apply ${{ github.event.inputs.bump == 'patch' && '--patch' || '' }}" >> $GITHUB_STEP_SUMMARY
          echo "git add data/snapshot/ package.json src/index.ts dist/" >> $GITHUB_STEP_SUMMARY
          echo 'git commit -m "snapshot refresh $(date +%Y-%m-%d)"' >> $GITHUB_STEP_SUMMARY
          echo "git push" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

# ══════════════════════════════════════════════════════════════════════════════
# OPTIONAL: FULLY AUTOMATED PUSH (disabled by default — see security model above)
#
# If you decide the pipeline is trustworthy enough to push without human review,
# add a second job that depends on build-snapshot and does the following:
#
#   needs: build-snapshot
#   steps:
#     - Download artifact
#     - Checkout cricketstudio-mcp (using MCP_PUBLIC_REPO_TOKEN secret — PAT
#       with repo scope on i-m-arul/cricketstudio-mcp)
#     - Run: node scripts/verify-snapshot.mjs --incoming <artifact-dir> --apply
#     - git add / commit / push branch snapshot-refresh/YYYY-MM-DD
#     - gh pr create
#
# The PR still goes through CI (validate + smoke) before auto-merging.
# Even in this mode, the human checkpoint is "approve the PR" rather than
# "run the apply script".
# ══════════════════════════════════════════════════════════════════════════════
